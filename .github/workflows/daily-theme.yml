name: Daily profile theme

# Changes page bgcolor every 24 hours:
#   odd UTC day  -> dark  (#0D1117)
#   even UTC day -> light (#FFFFFF)
# Keeps HTML profile content (no banner, no page SVG).

on:
  schedule:
    - cron: "0 0 * * *"   # once every 24 hours (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply odd/even page background
        run: python scripts/apply_theme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Theme already up to date."
          else
            DAY=$(date -u +%d)
            MODE=$(python -c "from datetime import datetime, timezone; d=datetime.now(timezone.utc).day; print('dark' if d%2 else 'light')")
            git commit -m "chore: set ${MODE} page background (UTC day ${DAY})"
            git push
          fi
