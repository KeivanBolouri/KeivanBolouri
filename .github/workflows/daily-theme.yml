name: Daily profile theme

on:
  schedule:
    # Twice daily so the odd/even swap is reliable (GitHub cron can lag)
    - cron: "15 0 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply odd/even SVG page background
        run: python scripts/apply_theme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/page.svg
          if git diff --staged --quiet; then
            echo "Theme already up to date."
          else
            DAY=$(date -u +%d)
            MODE=$(python -c "from datetime import datetime, timezone; d=datetime.now(timezone.utc).day; print('dark' if d%2 else 'light')")
            git commit -m "chore: switch profile to ${MODE} page background (UTC day ${DAY})"
            git push
          fi
