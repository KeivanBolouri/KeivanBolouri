name: Daily profile theme

on:
  workflow_dispatch:
    # Disabled automatic schedule — SVG/bgcolor theme experiments broke the profile page.
    # Keep manual-only so README is not overwritten daily.

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Skipped
        run: echo "Theme automation disabled to protect profile README."
